<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b59"><title>CBM V2.1 — QR Display</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f5fb;color:#17213b;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.wrap{width:min(620px,100%);background:#fff;border:1px solid #d9e2f1;border-radius:24px;padding:24px;text-align:center;box-shadow:0 12px 34px #172b5914}h1{margin:0 0 8px;color:#172b59}p{color:#65718b}select,input,button{width:100%;padding:15px;border-radius:12px;border:1px solid #cbd7e9;font-size:16px;margin:8px 0}button{background:#2457d6;color:white;font-weight:800;border:0;cursor:pointer}#qrcode{margin:20px auto;width:300px;min-height:300px;display:grid;place-items:center}#qrcode img,#qrcode canvas{max-width:100%;height:auto}.timer{font-size:42px;font-weight:900;color:#168344}.small{font-size:12px}.hide{display:none}.status{padding:12px;border-radius:12px;background:#edf4ff;margin-top:12px}</style></head>
<body><main class="wrap"><h1>CREW BREAK MONITORING</h1><h2>QR DISPLAY STORE · V2.1</h2><p>Perangkat ini menampilkan QR dinamis. Jaga layar tetap menyala dan jangan bagikan PIN display.</p>
<div id="setup"><select id="store"><option value="">Pilih store</option><option value="C17">C17 — SSS MENTENG</option><option value="C33">C33 — SKS CITYWALK</option><option value="C87">C87 — SS CITRA TOWER</option></select><input id="pin" type="password" autocomplete="off" placeholder="PIN khusus QR Display"><button id="activate">AKTIFKAN QR DISPLAY</button></div>
<section id="display" class="hide"><h2 id="storeName"></h2><div id="qrcode"></div><div class="timer" id="timer">30</div><p class="small">QR diperbarui otomatis setiap 30 detik · token berlaku maksimal 60 detik</p><button id="stop">KELUAR DARI DISPLAY</button></section><div class="status" id="status">Menunggu aktivasi perangkat.</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
(()=>{'use strict';const API='https://script.google.com/macros/s/AKfycbxu0M-rpP90WZj2RnC1EGMvVQf3YlHuW6V61CUIYvrv0c_4P1F8-ldvqZSJ4lG44gFEHA/exec';let storeCode='',displayPin='',qr=null,tick=null,refresh=null;const $=id=>document.getElementById(id);function jsonp(params){return new Promise((resolve,reject)=>{const cb='cbmqr_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const t=setTimeout(()=>finish(new Error('Server timeout')),15000);function finish(e,d){if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove();e?reject(e):resolve(d)}window[cb]=d=>finish(null,d);s.onerror=()=>finish(new Error('API tidak dapat diakses'));s.src=API+'?'+new URLSearchParams({...params,callback:cb});document.head.appendChild(s)})}async function issue(){try{const r=await jsonp({action:'issueQr',storeCode,displayPin});if(!r.success)throw Error(r.message||'Gagal membuat QR');$('storeName').textContent=r.storeCode+' — '+r.storeName;$('qrcode').innerHTML='';qr=new QRCode($('qrcode'),{text:r.qrText,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});$('status').textContent='QR aktif. Pembaruan otomatis berjalan.';let remain=30;clearInterval(tick);tick=setInterval(()=>{remain--; $('timer').textContent=remain;if(remain<=0)remain=30},1000)}catch(e){$('status').textContent=e.message;}}$('activate').onclick=async()=>{storeCode=$('store').value;displayPin=$('pin').value;if(!storeCode||!displayPin){$('status').textContent='Pilih store dan masukkan PIN display.';return}if(!window.QRCode){$('status').textContent='Library QR gagal dimuat.';return}$('setup').classList.add('hide');$('display').classList.remove('hide');await issue();refresh=setInterval(issue,30000)};$('stop').onclick=()=>{clearInterval(refresh);clearInterval(tick);storeCode='';displayPin='';$('display').classList.add('hide');$('setup').classList.remove('hide');$('qrcode').innerHTML='';$('status').textContent='Display dihentikan.'}})();
</script></body></html>
